<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWBATs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style id="app-css">
:root{
  --chrome:#FFFFFF; --chrome-2:#F3F5F7; --ink:#1B2530; --muted:#5B6874; --line:#D8DDE2;
  --accent:#2350C8; --accent-ink:#FFFFFF; --danger:#B42318;
  --ink-note:#1D1A14;
  --font:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chrome:#141A21; --chrome-2:#1C242D; --ink:#E6EBF0; --muted:#98A5B2; --line:#2B3642;
    --accent:#7FA4FF; --accent-ink:#0E1522; --danger:#FF8A7A;
  }
}
:root[data-theme="dark"]{
  --chrome:#141A21; --chrome-2:#1C242D; --ink:#E6EBF0; --muted:#98A5B2; --line:#2B3642;
  --accent:#7FA4FF; --accent-ink:#0E1522; --danger:#FF8A7A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;font-family:var(--font);color:var(--ink);background:var(--chrome);display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem;background:var(--chrome);border-bottom:1px solid var(--line);position:relative;z-index:50;flex:0 0 auto}
.tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;padding:.45rem .8rem;border-radius:.5rem;white-space:nowrap;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--chrome-2);color:var(--ink);border-color:var(--line)}
.tab.add{font-weight:400}
.date{color:var(--muted);white-space:nowrap;font-size:.95rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--chrome);padding:.45rem .75rem;border-radius:.5rem;white-space:nowrap}
.btn:hover{background:var(--chrome-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn svg{width:1.1em;height:1.1em;flex:0 0 auto}
.present-title{display:none;font-weight:700;font-size:1.35rem}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + .4rem);background:var(--chrome);border:1px solid var(--line);border-radius:.75rem;padding:.4rem;min-width:15rem;box-shadow:0 12px 32px rgba(10,20,30,.18);display:none;z-index:60}
.menu.open{display:block}
.menu button.item{display:flex;width:100%;align-items:center;gap:.6rem;border:0;background:none;padding:.55rem .6rem;border-radius:.5rem;text-align:left}
.menu button.item:hover{background:var(--chrome-2)}
.swatch{width:1rem;height:1rem;border-radius:.25rem;border:1px solid rgba(0,0,0,.2);flex:0 0 auto}
.menu h3{margin:.5rem .6rem .3rem;font-size:.85rem;color:var(--muted);font-weight:400}
.menu label{display:block;padding:.3rem .6rem;font-size:.85rem;color:var(--muted)}
.menu input[type=text]{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid var(--line);border-radius:.5rem;background:var(--chrome-2);color:var(--ink)}
.bg-row{display:flex;gap:.4rem;padding:.3rem .6rem .5rem}
.bg-row button{width:2.4rem;height:1.8rem;border-radius:.4rem;border:2px solid var(--line)}
.bg-row button[aria-pressed="true"]{border-color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:.4rem 0}
.menu .danger{color:var(--danger)}
.sync{padding:.3rem .6rem .5rem;font-size:.8rem;color:var(--muted)}

/* ---------- board ---------- */
.board{position:relative;flex:1 1 auto;overflow:hidden;--u:12px}
.board.bg-slate{background-color:#1E2A35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px}
.board.bg-white{background-color:#F1F3F4;background-image:radial-gradient(rgba(0,0,0,.07) 1px,transparent 1px);background-size:28px 28px}
.board.bg-cork{background-color:#BF956A;background-image:radial-gradient(rgba(90,50,20,.25) 1px,transparent 1.5px),radial-gradient(rgba(255,235,200,.25) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px}
.board.bg-green{background-color:#23392F;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75);text-align:center;padding:2rem;font-size:1.1rem}
.bg-white .empty,.bg-cork .empty{color:rgba(0,0,0,.6)}

/* ---------- note ---------- */
.note{position:absolute;display:flex;flex-direction:column;background:var(--paper);color:var(--ink-note);border-radius:3px 3px 10px 3px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 24px -8px rgba(0,0,0,.35);min-width:140px;min-height:70px;--s:1}
.note.is-min{height:auto !important;min-height:0}
.note.dragging{box-shadow:0 2px 4px rgba(0,0,0,.2),0 22px 40px -10px rgba(0,0,0,.45)}
.note-head{display:flex;align-items:center;gap:.35em;padding:.5em .55em .35em .7em;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-bottom:1px dashed rgba(0,0,0,.15);font-size:max(13px,calc(var(--u) * 1.2 * var(--s)))}
.is-min .note-head{border-bottom:0;padding-bottom:.5em}
.dragging .note-head{cursor:grabbing}
.grip{width:.8em;height:1.2em;flex:0 0 auto;opacity:.45}
.note-title{margin:0;font-size:1em;font-weight:700;line-height:1.2;flex:0 1 auto;min-width:1ch;outline:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.note-title[contenteditable]:not([contenteditable="false"]){cursor:text;white-space:normal;border-radius:3px}
.note-title[contenteditable]:not([contenteditable="false"]):focus{background:rgba(255,255,255,.55)}
.preview{display:none;font-weight:400;opacity:.75;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.is-min .preview{display:block}
.spacer{flex:1 1 auto;min-width:.5em;align-self:stretch}
.is-min .spacer{flex:0 0 .25em}
.tools{display:flex;gap:.1em;flex:0 0 auto}
.tool{border:0;background:transparent;width:1.9em;height:1.9em;display:grid;place-items:center;border-radius:.35em;color:inherit;opacity:.65;padding:0}
.tool:hover{opacity:1;background:rgba(0,0,0,.08)}
.tool svg{width:1.05em;height:1.05em}
.dot{width:.95em;height:.95em;border-radius:50%;border:2px solid rgba(0,0,0,.35);background:conic-gradient(#FFE66B 0 25%,#A6E8C6 0 50%,#A9D8F7 0 75%,#FFB8CB 0)}
.note-body{flex:1 1 auto;overflow:auto;padding:.45em .8em .8em;font-size:max(15px,calc(var(--u) * 2.05 * var(--s)));line-height:1.3}
.is-min .note-body{display:none}
.note-text{outline:none;white-space:pre-wrap;word-break:break-word;min-height:1.3em}
.note-text:empty::before{content:attr(data-ph);opacity:.4}
.list{list-style:none;margin:0;padding:0;counter-reset:n}
.list li{display:flex;gap:.45em;align-items:flex-start;padding:.12em 0;counter-increment:n}
.check{flex:0 0 auto;width:1em;height:1em;margin-top:.15em;border:2px solid rgba(0,0,0,.55);border-radius:.2em;background:transparent;padding:0;display:grid;place-items:center}
.check svg{width:.75em;height:.75em;opacity:0}
.done .check svg{opacity:1}
.list .num::before{content:counter(n) ".";font-weight:700;opacity:.55;min-width:1.2em;display:inline-block}
.item-text{outline:none;flex:1 1 auto;white-space:pre-wrap;word-break:break-word;min-width:2ch}
.item-text:empty::before{content:"New item";opacity:.4}
.done .item-text{text-decoration:line-through;text-decoration-thickness:.08em;opacity:.5}
.resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.22) 50%);border-bottom-right-radius:10px}
.is-min .resize{display:none}
.show-tools .tools .t-edit{display:grid}
.tools .t-edit{display:none}
.note:hover .tools .t-edit,.note:focus-within .tools .t-edit{display:grid}

/* ---------- present mode ---------- */
body.present .edit-only{display:none !important}
body.present .present-title{display:block}
body.present .tabs{display:none}
body.present .date{font-size:1.2rem;color:var(--ink);margin-left:auto}
body.present .tools .t-edit{display:none !important}
body.present .resize{display:none}
body.present .note-title,body.present .note-text,body.present .item-text{cursor:inherit}
.exit-present{display:none}
body.present .exit-present{display:inline-flex}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:.7rem 1rem;border-radius:.6rem;display:none;gap:1rem;align-items:center;z-index:100;max-width:calc(100% - 2rem);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{display:flex}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}

/* ---------- phone: stacked bars ---------- */
@media (max-width:700px){
  .date{display:none}
  .btn .lbl{display:none}
  .board{overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.6rem}
  .note{position:relative !important;left:auto !important;top:auto !important;width:auto !important;height:auto !important;min-height:0;z-index:auto !important;flex:0 0 auto}
  .note-body{max-height:none}
  .note-head{cursor:pointer;touch-action:auto}
  .resize,.grip{display:none}
  .tools .t-edit{display:none !important}
  .empty{position:static}
}
@media (prefers-reduced-motion:no-preference){
  .note.dragging{transition:box-shadow .15s}
}

/* ---------- sign-in screen ---------- */
.auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:1.25rem;background-color:#1E2A35;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;overflow:auto}
.auth[hidden]{display:none}
.auth-card{width:100%;max-width:24rem;background:#FFE66B;color:#1D1A14;padding:1.6rem 1.5rem 1.3rem;border-radius:3px 3px 14px 3px;box-shadow:0 2px 4px rgba(0,0,0,.2),0 24px 50px -12px rgba(0,0,0,.55);transform:rotate(-1deg)}
.auth-card h1{margin:0;font-size:2.4rem;line-height:1}
.auth-sub{margin:.5rem 0 1.1rem;line-height:1.35}
.auth-card label{display:block;font-weight:700;margin:.7rem 0 0}
.auth-card input{display:block;width:100%;margin-top:.3rem;font:inherit;font-weight:400;padding:.65rem .7rem;border:2px solid rgba(0,0,0,.35);border-radius:.4rem;background:#FFFDF0;color:#1D1A14}
.auth-card input:focus{outline:3px solid #2350C8;outline-offset:1px}
.auth-msg{min-height:1.3em;margin:.7rem 0 .4rem;font-size:.95rem}
.auth-msg.err{color:#9A1B10;font-weight:700}
.auth-card .wide{width:100%;justify-content:center;padding:.7rem;background:#2350C8;border-color:#2350C8;color:#fff;font-weight:700}
.auth-links{display:flex;justify-content:space-between;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
.auth-links button,.auth-skip{border:0;background:none;padding:.2rem 0;text-decoration:underline;color:#1D1A14}
.auth-skip{display:block;margin-top:1rem;font-size:.9rem;opacity:.75}
.acct{padding:.2rem .6rem .5rem;font-size:.85rem;color:var(--muted);word-break:break-all}

/* ---------- floating window (picture-in-picture) ---------- */
.pip{padding:.6rem;display:flex;flex-direction:column;gap:.5rem;height:100%;overflow:auto;background:#1E2A35}
.pip-top{color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;padding:.1rem .2rem}
.pip-top b{font-size:1.05rem}
.pip-top span{font-size:.85rem;opacity:.75}
.pip .note{position:relative;--u:8px}
.pip .note-head{cursor:pointer;touch-action:auto}
.pip .grip,.pip .resize,.pip .t-edit{display:none !important}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="present-title" id="presentTitle"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Classes"></nav>
  <span class="date" id="date"></span>
  <div class="menu-wrap edit-only">
    <button class="btn primary" id="addBtn" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add note</span>
    </button>
    <div class="menu" id="addMenu" role="menu"></div>
  </div>
  <button class="btn edit-only" id="pipBtn" title="Open a small always-on-top window">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg><span class="lbl">Float</span>
  </button>
  <button class="btn edit-only" id="presentBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg><span class="lbl">Present</span>
  </button>
  <div class="menu-wrap edit-only">
    <button class="btn" id="setBtn" aria-haspopup="true" aria-expanded="false" title="Class settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="lbl">Class</span>
    </button>
    <div class="menu" id="setMenu" role="menu"></div>
  </div>
  <button class="btn exit-present" id="exitBtn">Edit board</button>
</header>
<main class="board" id="board" aria-label="Class board"></main>
<div class="auth" id="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <h1>SWBATs</h1>
    <p class="auth-sub" id="authSub">Sign in to see your class boards on any device.</p>
    <label for="authEmail" id="emailWrap">Email</label>
    <input type="email" id="authEmail" autocomplete="email" required>
    <label for="authPw" id="pwLabel">Password</label>
    <input type="password" id="authPw" autocomplete="current-password" minlength="6" required>
    <p class="auth-msg" id="authMsg" role="alert"></p>
    <button class="btn wide" id="authSubmit" type="submit">Sign in</button>
    <div class="auth-links">
      <button type="button" id="authSwitch">Create an account</button>
      <button type="button" id="authForgot">Forgot password?</button>
    </div>
    <button type="button" class="auth-skip" id="authSkip">Use without an account (saves on this device only)</button>
  </form>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden>Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
const LS_KEY = "classboard.v1";
const COLORS = { lemon:"#FFE66B", mint:"#A6E8C6", sky:"#A9D8F7", rose:"#FFB8CB", tangerine:"#FFC98F", paper:"#FBFAF6" };
const COLOR_KEYS = Object.keys(COLORS);
const BGS = { slate:"Slate", green:"Chalkboard", white:"Whiteboard", cork:"Corkboard" };
const BG_SWATCH = { slate:"#1E2A35", green:"#23392F", white:"#F1F3F4", cork:"#BF956A" };
const uid = () => Math.random().toString(36).slice(2,10);

const TYPES = {
  objective:{ label:"SWBAT", kind:"text", color:"lemon", w:44, h:24, text:"Students will be able to " },
  agenda:{ label:"Agenda", kind:"list", color:"sky", w:30, h:44, items:["Do Now",""] },
  homework:{ label:"Homework", kind:"text", color:"rose", w:30, h:26, text:"" },
  reminder:{ label:"Reminder", kind:"text", color:"tangerine", w:26, h:20, text:"" },
  list:{ label:"Checklist", kind:"list", color:"mint", w:28, h:32, items:[""] },
  note:{ label:"Blank note", kind:"text", color:"paper", w:26, h:22, text:"" }
};
const PH = { objective:"What students will learn today", homework:"Assignment and due date", reminder:"Something students shouldn't forget", note:"Type here" };

function makeNote(type, pos){
  const t = TYPES[type];
  const n = { id:uid(), type, kind:t.kind, title:t.label, color:t.color,
    x:pos?pos.x:4, y:pos?pos.y:6, w:t.w, h:t.h, s:1, min:false, z:++zTop };
  if (t.kind === "list") n.items = t.items.map(s => ({ id:uid(), t:s, done:false }));
  else n.text = t.text;
  return n;
}
let zTop = 10;
function seed(){
  const n1 = makeNote("objective",{x:3,y:5}); n1.text = "Students will be able to identify the main idea of a passage and support it with two details from the text."; n1.w=48; n1.h=26;
  const n2 = makeNote("agenda",{x:55,y:5});
  n2.items = ["Do Now: quick write (5 min)","Mini-lesson: finding the main idea","Partner practice","Exit ticket"].map(t=>({id:uid(),t,done:false}));
  n2.w=40; n2.h=50;
  const n3 = makeNote("homework",{x:3,y:37}); n3.text = "Read pages 42–47 and answer questions 1–3.\nDue Thursday."; n3.w=48; n3.h=26;
  const b = { id:uid(), name:"Period 1", bg:"slate", notes:[n1,n2,n3] };
  const b2 = { id:uid(), name:"Period 2", bg:"green", notes:[] };
  return { v:1, active:b.id, boards:[b,b2], updatedAt:0 };
}

/* ---------- state + persistence ---------- */
/* ==== PASTE YOUR SUPABASE DETAILS HERE (Project Settings > API) ==== */
const SUPABASE_URL = "https://xdaqxfsfrlvmdmujjvax.supabase.co";   // e.g. "https://abcdefghijk.supabase.co"
const SUPABASE_KEY = "sb_publishable_XDqCiU9aNwO2sO9KuLm_7Q_tEw6y59Y";   // the anon / publishable key. NEVER the service_role or secret key.
/* ================================================================== */
const cloudReady = !!(SUPABASE_URL && SUPABASE_KEY && window.supabase && window.supabase.createClient);
const sb = cloudReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const redirectURL = location.origin + location.pathname;

const LOCAL_KEY = "swbats.local.v1";
let userId = null, userEmail = "";
const cacheKey = () => userId ? "swbats.user." + userId : LOCAL_KEY;
function valid(s){ return s && Array.isArray(s.boards) && s.boards.length; }
function readCache(key){ try { const s = JSON.parse(localStorage.getItem(key)); if (valid(s)) return s; } catch(e){} return null; }
function setState(next){
  state = next;
  if (!state.boards.some(b => b.id === state.active)) state.active = state.boards[0].id;
  zTop = Math.max(10, ...state.boards.flatMap(b => b.notes.map(n => n.z||0)));
}
let state = null;
setState(readCache(LOCAL_KEY) || seed());

let syncLabel = sb ? "Not signed in. Boards save in this browser only."
                   : "Boards save automatically in this browser. Use Export to move them to another device.";
let remoteTimer = null;
function setSync(t){ syncLabel = t; const el = document.getElementById("syncLine"); if (el) el.textContent = t; }
function saveLocal(){ try { localStorage.setItem(cacheKey(), JSON.stringify(state)); } catch(e){} }
function save(){
  state.updatedAt = Date.now();
  saveLocal();
  if (sb && userId){ clearTimeout(remoteTimer); remoteTimer = setTimeout(pushRemote, 900); }
  renderPip();
}
async function pushRemote(){
  if (!sb || !userId) return;
  const { error } = await sb.from("boards").upsert({ user_id:userId, data:state, updated_ms:state.updatedAt || Date.now() });
  setSync(error ? "Can't reach the server right now. Changes are saved on this device and will sync later."
                : "Signed in as " + userEmail + ". Boards sync to every device.");
}
async function fetchRemote(){
  const { data, error } = await sb.from("boards").select("data, updated_ms").eq("user_id", userId).maybeSingle();
  return { remote: (data && valid(data.data)) ? data : null, error };
}
async function onSignedIn(user){
  userId = user.id; userEmail = user.email || "";
  hideAuth();
  const cached = readCache(cacheKey());
  const { remote, error } = await fetchRemote();
  if (error){
    if (cached) setState(cached);
    setSync("Can't reach the server right now. Working from this device.");
  } else if (remote && (!cached || (remote.updated_ms||0) >= (cached.updatedAt||0))){
    setState(remote.data);
    setSync("Signed in as " + userEmail + ". Boards sync to every device.");
  } else if (cached){
    setState(cached); pushRemote();
  } else {
    // brand-new account: keep whatever is on this device and save it to the account
    state.updatedAt = Date.now(); pushRemote();
  }
  saveLocal(); render(); renderPip();
}
async function pullRemote(){
  if (!sb || !userId) return;
  const { remote } = await fetchRemote();
  if (remote && (remote.updated_ms||0) > (state.updatedAt||0)){ setState(remote.data); saveLocal(); render(); renderPip(); }
}
async function signOut(){
  // shared classroom computers: remove this teacher's copy from the browser
  try { localStorage.removeItem(cacheKey()); } catch(e){}
  clearTimeout(remoteTimer);
  userId = null; userEmail = "";
  try { await sb.auth.signOut(); } catch(e){}

function handleNoteAction(n, e, noteNode, inPip){
  const btn = e.target.closest("[data-act]");
  // on phones and in the floating window, tapping a bar opens it
  if (!btn && (narrow() || inPip) && e.target.closest(".note-head") && !e.target.isContentEditable){
    n.min = !n.min; after(); return;
  }
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "min"){ n.min = !n.min; }
  else if (act === "color"){ n.color = COLOR_KEYS[(COLOR_KEYS.indexOf(n.color)+1) % COLOR_KEYS.length]; }
  else if (act === "smaller"){ n.s = Math.max(0.5, +( (n.s||1) - 0.15).toFixed(2)); }
  else if (act === "bigger"){ n.s = Math.min(3, +((n.s||1) + 0.15).toFixed(2)); }
  else if (act === "check"){
    const li = btn.closest("[data-item]"); const it = n.items.find(i => i.id === li.dataset.item);
    if (it) it.done = !it.done;
  }
  else if (act === "delete"){
    const b = board(); const idx = b.notes.indexOf(n);
    b.notes.splice(idx,1); noteNode.remove(); save();
    if (!b.notes.length) renderBoard();
    toast("Note deleted", () => { b.notes.splice(idx,0,n); renderBoard(); save(); });
    return;
  } else return;
  after();
  function after(){
    save();
    if (inPip) { const bn = boardEl.querySelector(`.note[data-id="${n.id}"]`); if (bn) renderNote(n); }
    else renderNote(n);
  }
}

/* drag + resize with pointer events (mouse, pen and touch) */
let drag = null;
boardEl.addEventListener("pointerdown", e => {
  if (narrow()) return;
  const noteNode = e.target.closest(".note"); if (!noteNode) return;
  const n = findNote(noteNode.dataset.id); if (!n) return;
  if (n.z !== zTop){ n.z = ++zTop; noteNode.style.zIndex = n.z; }
  const isResize = e.target.closest("[data-act=resize]");
  const inHead = e.target.closest(".note-head");
  if (!isResize && !inHead) return;
  if (!isResize && (e.target.closest("button") || (e.target.isContentEditable))) return;
  e.preventDefault();
  const r = boardEl.getBoundingClientRect();
  drag = { n, el:noteNode, mode:isResize?"resize":"move", sx:e.clientX, sy:e.clientY,
    x:n.x, y:n.y, w:n.w, h:n.h, W:r.width, H:r.height, pid:e.pointerId, moved:false,
    elH: noteNode.offsetHeight };
  noteNode.setPointerCapture(e.pointerId);
  noteNode.classList.add("dragging");
});
boardEl.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = (e.clientX - drag.sx) / drag.W * 100, dy = (e.clientY - drag.sy) / drag.H * 100;
  if (Math.abs(dx)+Math.abs(dy) > 0.2) drag.moved = true;
  const n = drag.n;
  if (drag.mode === "move"){
    const hPct = drag.elH / drag.H * 100;
    n.x = clamp(drag.x + dx, -n.w + 8, 100 - 4);
    n.y = clamp(drag.y + dy, 0, 100 - Math.min(hPct, 8));
    drag.el.style.left = n.x + "%"; drag.el.style.top = n.y + "%";
  } else {
    n.w = clamp(drag.w + dx, 140 / drag.W * 100, 100 - n.x);
    n.h = clamp(drag.h + dy, 70 / drag.H * 100, 100 - n.y);
    drag.el.style.width = n.w + "%"; drag.el.style.height = n.h + "%";
  }
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  drag.el.classList.remove("dragging");
  if (drag.moved) save();
  else if (drag.n.z) save();
  drag = null;
}
boardEl.addEventListener("pointerup", endDrag);
boardEl.addEventListener("pointercancel", endDrag);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

  const d = pipWin.document;
  const link = d.createElement("link"); link.rel = "stylesheet"; link.href = $("font-link").href; d.head.appendChild(link);
  const st = d.createElement("style"); st.textContent = $("app-css").textContent; d.head.appendChild(st);
  d.title = "SWBATs";
  d.body.innerHTML = '<div class="pip" id="pip"></div>';
  d.body.addEventListener("click", e => {
    const noteNode = e.target.closest(".note"); if (!noteNode) return;
    const n = findNote(noteNode.dataset.id); if (!n) return;
    handleNoteAction(n, e, noteNode, true);
  });
  pipWin.addEventListener("pagehide", () => { pipWin = null; });
  renderPip();
});
function renderPip(){
  if (!pipWin || pipWin.closed) return;
  const root = pipWin.document.getElementById("pip"); if (!root) return;
  const b = board();
  root.innerHTML = `<div class="pip-top"><b></b><span></span></div>`;
  root.querySelector("b").textContent = b.name;
  root.querySelector("span").textContent = $("date").textContent;
  b.notes.slice().sort((a,c) => a.y - c.y || a.x - c.x).forEach(n => {
    const el = noteEl(n, true);
    el.style.cssText = `--paper:${COLORS[n.color]};--s:1`;
    root.appendChild(el);
  });
}

if (sb){
  $("authSwitch").addEventListener("click", () => showAuth(authMode === "signin" ? "signup" : "signin"));
  $("authForgot").addEventListener("click", () => showAuth("forgot"));
  $("authSkip").addEventListener("click", () => { try { localStorage.setItem("swbats.skipLogin","1"); } catch(e){} hideAuth(); });
  $("authForm").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("authEmail").value.trim(), pw = $("authPw").value;
    const btn = $("authSubmit");
    if (authMode !== "reset" && !/^\S+@\S+\.\S+$/.test(email)) return authMsg("Enter a valid email address.", true);
    if ((authMode === "signin" || authMode === "signup" || authMode === "reset") && pw.length < 6) return authMsg("Passwords need at least 6 characters.", true);
    btn.disabled = true; authMsg("One moment…");
    try {
      if (authMode === "signin"){
        const { error } = await sb.auth.signInWithPassword({ email, password:pw });
        if (error) authMsg(/confirm/i.test(error.message) ? "Confirm your email first. Check your inbox for the link." : "That email and password don't match. Try again or reset your password.", true);
        else { try { localStorage.removeItem("swbats.skipLogin"); } catch(e){} $("authPw").value = ""; }
      } else if (authMode === "signup"){
        const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ emailRedirectTo: redirectURL } });
        if (error) authMsg(error.message, true);
        else if (!data.session){ showAuth("signin"); $("authEmail").value = email; authMsg("Account created. Check your email for a confirmation link, then sign in here."); }
      } else if (authMode === "forgot"){
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectURL });
        if (error) authMsg(error.message, true); else authMsg("If that email has an account, a reset link is on its way.");
      } else if (authMode === "reset"){
        const { error } = await sb.auth.updateUser({ password:pw });
        if (error) authMsg(error.message, true);
        else { hideAuth(); history.replaceState(null, "", redirectURL); toast("Password updated."); }
      }
    } catch(err){ authMsg("Can't reach the server. Check your internet connection and try again.", true); }
    btn.disabled = false;
  });
}

$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const next = JSON.parse(await f.text());
    if (!next || !Array.isArray(next.boards) || !next.boards.length) throw 0;
    setState(next);
    render(); save(); toast("Imported " + state.boards.length + " class" + (state.boards.length>1?"es":"") + ".");
  } catch(err){ toast("That file isn't a SWBATs backup. Choose a file made with Export."); }
});

render();
})();
</script>
